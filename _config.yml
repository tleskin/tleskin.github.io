# Tom Codes — tleskin.github.io
# Built with Jekyll on GitHub Pages (github-pages gem, Jekyll 3.10).
# Local preview: `bundle install` then `bundle exec jekyll serve`.

# Theme: So Simple 3.2.0, installed as a remote theme. The classic Pages
# build (Jekyll 3.10) can't run Chirpy or Minima v3 — both need Jekyll 4 /
# a GitHub Actions build. So Simple needs Jekyll >= 3.6, < 5.0 and only
# Pages-whitelisted plugins, so it builds on the classic Pages stack.
remote_theme: "mmistakes/so-simple-theme@3.2.0"
skin: "/assets/css/skins/default.css"
locale: en-US

title: Tom Codes
description: >-
  Notes on building software — by a front-end engineer who came back
  to making things for fun.

url: "https://tleskin.github.io"
baseurl: ""
permalink: blog/:title/

markdown: kramdown
highlighter: rouge
date_format: "%B %-d, %Y"

# So Simple typography (Source Sans Pro + Lora, loaded from Google Fonts).
google_fonts:
  - name: "Source Sans Pro"
    weights: "400,400i,700,700i"
  - name: "Lora"
    weights: "400,400i,700,700i"

# Reading-time estimates on posts.
read_time: true

# jekyll-feed writes the feed to atom.xml (the theme's footer links there).
feed:
  path: atom.xml

# No search page is set up; leave full-content search off.
search_full_content: false

twitter:
  username: tomleskin

# Plugins whitelisted on GitHub Pages.
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate

# New posts get the post layout and share buttons by default.
defaults:
  - scope:
      path: "_posts"
      type: posts
    values:
      layout: post
      share: true

# Site author — shown in the sidebar on every post.
author:
  name: Tom Leskin
  picture: /assets/img/talk.jpg
  email: tleskin@gmail.com
  twitter: tomleskin
  links:
    - title: GitHub
      url: https://github.com/tleskin
      icon: fab fa-github
    - title: LinkedIn
      url: https://www.linkedin.com/in/thomasleskin
      icon: fab fa-linkedin

# Footer links.
footer_links:
  - title: Feed
    url: atom.xml
    icon: fas fa-rss-square
