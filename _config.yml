# Tom Codes — tleskin.github.io
# Built with Jekyll on GitHub Pages (github-pages gem, Jekyll 3.10).
# Local preview: `bundle install` then `bundle exec jekyll serve`.
# Custom theme: site-local files in _layouts/, _includes/, _sass/.
# No gem, no remote_theme — everything the theme needs lives in this repo.

title: Tom Codes
description: >-
  Notes on building software — by a front-end engineer who came back
  to making things for fun.

url: "https://tleskin.github.io"
baseurl: ""
permalink: blog/:title/

markdown: kramdown
highlighter: rouge
date_format: "%B %-d, %Y"

twitter:
  username: tomleskin

# jekyll-feed writes the feed to atom.xml.
feed:
  path: atom.xml

# Plugins whitelisted on GitHub Pages.
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate

# Site author.
author:
  name: Tom Leskin
  picture: /assets/img/talk.jpg
  email: tleskin@gmail.com
  twitter: tomleskin
  links:
    - title: GitHub
      url: https://github.com/tleskin
    - title: LinkedIn
      url: https://www.linkedin.com/in/thomasleskin

# Interests shown in the "Nerd Stuff" row on the homepage.
interests:
  - Homebrewing
  - Nintendo & retro gaming
  - Local AI
  - Coding
