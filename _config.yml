# Tom Codes — tleskin.github.io
# Built with Jekyll on GitHub Pages (github-pages gem, Jekyll 3.10).
# Local preview: `bundle install` then `bundle exec jekyll serve`.

title: Tom Codes
description: >-
  Notes on building software — by a front-end engineer who came back
  to making things for fun.
author: Tom Leskin
email: tleskin@gmail.com

url: "https://tleskin.github.io"
baseurl: ""
permalink: blog/:title/

markdown: kramdown
highlighter: rouge

# Theme: Minima 2.5.1 — the exact version GitHub Pages ships and pins.
# (Minima v3 and Chirpy both need Jekyll 4 / a GitHub Actions build,
# which this repo doesn't use yet. See README.md.)
theme: minima

# Minima: only these pages appear in the header navigation.
header_pages:
  - about.md

# Minima: show post excerpts on the home page.
show_excerpts: true

# Minima: footer social links.
github_username: tleskin
twitter_username: tomleskin
linkedin_username: thomasleskin
rss: subscribe

# Minima: date format (e.g. "November 12, 2026").
minima:
  date_format: "%B %-d, %Y"

# Plugins whitelisted on GitHub Pages.
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
