<header class="site-header">
  <div class="wrap header-inner">
    <a class="site-title" href="{{ '/' | relative_url }}">Tom<span>Codes</span><span class="brand-dot">.</span></a>
    <nav class="site-nav" aria-label="Main">
      <a {% if page.url == '/' %}class="active" aria-current="page"{% endif %} href="{{ '/' | relative_url }}">Home</a>
      <a href="{{ '/#journal' | relative_url }}">Journal</a>
      <a href="{{ '/about/' | relative_url }}">About</a>
    </nav>
    {% if page.url == '/' %}
      <label class="header-search"><span aria-hidden="true">⌕</span><span class="sr-only">Search posts</span><input id="post-search" type="search" placeholder="Search posts..." autocomplete="off"></label>
    {% else %}
      <a class="header-search search-link" href="{{ '/#journal' | relative_url }}">⌕ <span>Explore posts</span></a>
    {% endif %}
  </div>
</header>
