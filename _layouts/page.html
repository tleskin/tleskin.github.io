---
layout: default
---

<article class="page">
  <div class="wrap">
    <header class="page-header">
      <h1 class="page-title">{{ page.title }}</h1>
    </header>
    {% if page.image %}
      <div class="page-image">
        <img src="{{ page.image | relative_url }}" alt="">
      </div>
    {% endif %}
    <div class="page-content">
      {{ content }}
    </div>
  </div>
</article>
